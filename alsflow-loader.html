<!-- ===========================================================================
     ALSflow — úvodní loader

     Copy-paste blok. Dvě části, oddělené značkami níže:
       ČÁST 1 patří na konec hlavičky stránky (před koncovou značku head),
       ČÁST 2 hned na začátek těla stránky — musí být první prvek,
       jinak by na okamžik probliknul obsah pod loaderem.

     Jak se chová:
       - ukáže se jen při PRVNÍM otevření v dané relaci prohlížeče,
         další proklik po webu už ho nezobrazí (sessionStorage)
       - zmizí, jakmile je stránka načtená, nejpozději po 2,2 s —
         nikdy se nezasekne, i kdyby se něco nenačetlo
       - bez JavaScriptu se nezobrazí vůbec (<noscript> ho schová)
       - respektuje systémové „omezit pohyb"

     Loader je čistě dekorativní: má aria-hidden a po doběhnutí se maže
     z DOM, takže do něj nikdy nespadne fokus ani čtečka obrazovky.
     ======================================================================== -->

<!-- ALSFLOW-LOADER:HEAD -->
<style>
  #alsLoader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #08080c;
    opacity: 1;
    transition: opacity 0.55s ease;
  }

  #alsLoader[hidden] { display: none; }

  html.als-loading,
  html.als-loading body { overflow: hidden; }

  #alsLoader.is-out {
    pointer-events: none;
    opacity: 0;
  }

  .als-loader__mark {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    font-size: clamp(1.9rem, 6vw, 3.1rem);
    font-weight: 900;
    letter-spacing: -0.045em;
    line-height: 1;
    background: linear-gradient(120deg, #fff 0%, #8b8b9e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transform: translateY(9px);
    animation: alsRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .als-loader__mark span {
    background: linear-gradient(120deg, #60a5fa, #2563eb);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* vlasová linka, která se pod značkou rozjede zleva doprava */
  .als-loader__bar {
    width: clamp(120px, 22vw, 190px);
    height: 1px;
    margin-top: 1.4rem;
    overflow: hidden;
    background: rgb(255 255 255 / 8%);
  }

  .als-loader__bar i {
    display: block;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #3b82f6, transparent);
    animation: alsSweep 1.15s ease-in-out infinite;
  }

  @keyframes alsRise {
    to { opacity: 1; transform: none; }
  }

  @keyframes alsSweep {
    from { transform: translateX(-100%); }
    to   { transform: translateX(350%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .als-loader__mark { opacity: 1; transform: none; animation: none; }
    .als-loader__bar  { display: none; }
    #alsLoader { transition-duration: 0.001ms; }
  }
</style>

<script>
  /* Běží co nejdřív, ještě před vykreslením obsahu — jinak by loader
     naskočil až na chvíli hotovou stránku a probliklo by to. */
  (function () {
    try {
      if (sessionStorage.getItem('als-seen')) return;
    } catch (e) {
      /* privátní okno nebo zakázané úložiště — loader prostě ukážeme */
    }
    document.documentElement.classList.add('als-loading');
  })();
</script>

<!-- ALSFLOW-LOADER:BODY -->
<div id="alsLoader" aria-hidden="true">
  <div>
    <div class="als-loader__mark">ALS<span>flow</span></div>
    <div class="als-loader__bar"><i></i></div>
  </div>
</div>

<noscript>
  <style>#alsLoader { display: none; }</style>
</noscript>

<script>
  (function () {
    var root = document.documentElement;
    var el = document.getElementById('alsLoader');

    /* Značka se v relaci ukazuje jen jednou. Když ji uživatel už viděl,
       skript výše nepřidal třídu — loader hned odstraníme. */
    if (!el || !root.classList.contains('als-loading')) {
      if (el) el.remove();
      return;
    }

    var MIN = 700;    /* ať to neproblikne na rychlém připojení */
    var MAX = 2200;   /* pojistka: po této době mizí vždycky */
    var start = Date.now();
    var done = false;

    function finish() {
      if (done) return;
      done = true;

      el.classList.add('is-out');
      root.classList.remove('als-loading');

      /* Po doznění se maže z DOM, aby nezavazel fokusu ani čtečce. */
      setTimeout(function () { el.remove(); }, 600);

      try { sessionStorage.setItem('als-seen', '1'); } catch (e) {}
    }

    function ready() {
      setTimeout(finish, Math.max(0, MIN - (Date.now() - start)));
    }

    if (document.readyState === 'complete') ready();
    else window.addEventListener('load', ready);

    setTimeout(finish, MAX);
  })();
</script>
